<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MOTOAI — AI-powered motorcycle discovery. Compare bikes, get personalized recommendations and find your perfect ride."
    />
    <meta name="theme-color" content="#070707" />
    <meta property="og:title" content="MOTOAI — Find Your Perfect Ride" />
    <meta
      property="og:description"
      content="AI-powered motorcycle discovery, comparison and personalized recommendations."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <title>MOTOAI — Find Your Perfect Ride</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("motoai_theme");
          var theme = stored === "light" || stored === "dark" ? stored : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.classList.remove("dark", "light");
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
